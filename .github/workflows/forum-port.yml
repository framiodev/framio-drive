name: Forum paketi onizleme

# forum-port/ degisince paketi derler ve onizleme icin yukler (yerelde npm yok; dogrulama bu ciktidan yapilir).
on:
  push:
    branches: [main]
    paths: ['forum-port/**', '.github/workflows/forum-port.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: cd forum-port && npm install --no-audit --no-fund && node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forum-port
          path: |
            app/ui/forum-port.js
            app/ui/forum-port.css
