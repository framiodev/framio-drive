name: Forum paketi onizleme

# forum-port/ degisince paketi derler ve onizleme icin yukler (yerelde npm yok; dogrulama bu ciktidan yapilir).
on:
  push:
    branches: [main]
    paths: ['forum-port/**', '.github/workflows/forum-port.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: cd forum-port && npm install --no-audit --no-fund && node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forum-port
          path: |
            app/ui/forum-port.js
            app/ui/forum-port.css
      - name: Onizleme dalina it
        run: |
          mkdir /tmp/out && cp app/ui/forum-port.js app/ui/forum-port.css /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b forum-port-build
          git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m build
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" forum-port-build
