[package]
name = "framio-drive"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
winfsp = { version = "0.13", features = ["system"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
drivesync = { path = "../drivesync" }
drivenet = { path = "../drivenet" }
drivefs = { path = "../drivefs" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
