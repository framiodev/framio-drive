[package]
name = "framio-drive"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
winfsp = { version = "0.13", features = ["system"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
rustpotter = "3"
# rustpotter -> candle-core 0.2: half 2.5+ (rand 0.9) ile derlenmiyor
half = "=2.4.1"
drivesync = { path = "../drivesync" }
drivenet = { path = "../drivenet" }
drivefs = { path = "../drivefs" }
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
